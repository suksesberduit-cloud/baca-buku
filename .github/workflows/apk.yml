name: Build APK debug
on: {workflow_dispatch: {}, push: {tags: ['v*']}}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: node scripts/scan-secrets.mjs .
      - run: npx cap add android
      - run: cp -r assets/android-res/. android/app/src/main/res/
      - run: sed -i 's#</manifest>#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: {name: baca-buku-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
